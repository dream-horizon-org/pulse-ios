name: Validate Release PR

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Framework Compatibility
    if: startsWith(github.head_ref, 'release/')
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        run: |
          VERSION=$(grep "spec.version" PulseKit.podspec | head -1 | sed "s/.*\"\(.*\)\"/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "::notice::Validating version: $VERSION"

      - name: Validate branch matches podspec version
        run: |
          PODSPEC_VERSION=$(grep "spec.version" PulseKit.podspec | head -1 | sed "s/.*\"\(.*\)\"/\1/")
          BRANCH="${{ github.head_ref }}"
          EXPECTED="release/${PODSPEC_VERSION}"
          if [ "$BRANCH" != "$EXPECTED" ]; then
            echo "::error::PR head ref must be release/<podspec-version>. Got '$BRANCH', podspec is '$PODSPEC_VERSION' (expected '$EXPECTED')."
            exit 1
          fi
          echo "::notice::Branch and podspec version agree: $PODSPEC_VERSION"

      # Optional: legacy Package.swift used `let version = "…"`. Generated manifests from pulse-ios-sdk may omit it.
      - name: Optional Package.swift version line
        run: |
          if grep -q 'let version' Package.swift 2>/dev/null; then
            SPM_VERSION=$(grep 'let version' Package.swift | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
            PODSPEC_VERSION=$(grep "spec.version" PulseKit.podspec | head -1 | sed "s/.*\"\(.*\)\"/\1/")
            echo "Package.swift let version: $SPM_VERSION"
            if [ "$PODSPEC_VERSION" != "$SPM_VERSION" ]; then
              echo "::error::Package.swift let version ($SPM_VERSION) != podspec ($PODSPEC_VERSION)"
              exit 1
            fi
            echo "::notice::let version matches podspec"
          else
            echo "::notice::No let version in Package.swift — using branch/podspec check only (expected for generated manifests)"
          fi

      # Patch for CI: inject a small target that imports PulseKit (public API smoke test).
      # Supports path-only .binaryTarget layout from Scripts/release/sync-release-distribution.rb (any number of peers).
      - name: Patch Package.swift for validation
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          path = Path("Package.swift")
          content = path.read_text()

          # If PulseKitBinary still points at a URL (pre-release GitHub asset), use local xcframework.
          content = re.sub(
              r'\.binaryTarget\(\s*name:\s*"PulseKitBinary"\s*,\s*url:\s*[^\)]+\)',
              '.binaryTarget(name: "PulseKitBinary", path: "PulseKit.xcframework")',
              content,
              flags=re.DOTALL,
          )

          if 'name: "PulseKitValidation"' in content:
              path.write_text(content)
              print("PulseKitValidation already present; skipping injection")
          else:
              # Second product library
              content = content.replace(
                  '.library(name: "PulseKit", targets: ["PulseKitWrapper"]),',
                  '.library(name: "PulseKit", targets: ["PulseKitWrapper"]),\n        .library(name: "PulseKitValidation", targets: ["PulseKitValidation"]),',
                  1,
              )
              # Insert validation target immediately after PulseKitWrapper target
              m = re.search(
                  r'(path:\s*"Sources/PulseKitWrapper"\s*\),)(\s*\n\s*\])',
                  content,
              )
              if not m:
                  print("::error::Could not find PulseKitWrapper target closing in Package.swift")
                  raise SystemExit(1)
              injection = (
                  m.group(1)
                  + "\n"
                  + "        .target(\n"
                  + '            name: "PulseKitValidation",\n'
                  + "            dependencies: [\n"
                  + '                "PulseKitWrapper",\n'
                  + "            ],\n"
                  + '            path: "Example/Sources"\n'
                  + "        ),"
                  + m.group(2)
              )
              content = content[: m.start()] + injection + content[m.end() :]
              path.write_text(content)
              print("Injected PulseKitValidation target + product")

          print("--- Package.swift (tail) ---")
          print("\n".join(path.read_text().splitlines()[-35:]))
          PYEOF

          echo "::notice::Package.swift patched for validation"

      - name: Swift package resolve (sanity)
        run: swift package resolve

      - name: Build example app (iOS Simulator)
        run: |
          set -o pipefail
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild build \
              -scheme PulseKitValidation \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              CODE_SIGNING_ALLOWED=NO 2>&1 | xcpretty
          else
            xcodebuild build \
              -scheme PulseKitValidation \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              CODE_SIGNING_ALLOWED=NO
          fi
          echo "::notice::Example app built successfully for iOS Simulator"

      - name: Build example app (iOS Device)
        run: |
          set -o pipefail
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild build \
              -scheme PulseKitValidation \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO 2>&1 | xcpretty
          else
            xcodebuild build \
              -scheme PulseKitValidation \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
          fi
          echo "::notice::Example app built successfully for iOS Device"

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Validate podspec
        run: |
          pod lib lint PulseKit.podspec --allow-warnings
          echo "::notice::Podspec lint passed"

      - name: Summary
        if: always()
        run: |
          echo "## Release PR Validation — v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | What it validates |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch vs podspec | \`release/<version>\` matches \`spec.version\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Optional \`let version\` | If present in Package.swift, matches podspec |" >> $GITHUB_STEP_SUMMARY
          echo "| Example app (Simulator) | Framework links, compiles & public API intact |" >> $GITHUB_STEP_SUMMARY
          echo "| Example app (Device) | Same for device slice |" >> $GITHUB_STEP_SUMMARY
          echo "| CocoaPods lint | Podspec valid for trunk |" >> $GITHUB_STEP_SUMMARY
