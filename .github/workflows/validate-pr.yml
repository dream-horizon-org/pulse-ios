name: Validate Release PR

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Framework Compatibility
    if: startsWith(github.head_ref, 'release/')
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        run: |
          VERSION=$(grep "spec.version" PulseKit.podspec | head -1 | sed "s/.*\"\(.*\)\"/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "::notice::Validating version: $VERSION"

      - name: Validate branch matches podspec version
        run: |
          PODSPEC_VERSION=$(grep "spec.version" PulseKit.podspec | head -1 | sed "s/.*\"\(.*\)\"/\1/")
          BRANCH="${{ github.head_ref }}"
          EXPECTED="release/${PODSPEC_VERSION}"
          if [ "$BRANCH" != "$EXPECTED" ]; then
            echo "::error::PR head ref must be release/<podspec-version>. Got '$BRANCH', podspec is '$PODSPEC_VERSION' (expected '$EXPECTED')."
            exit 1
          fi
          echo "::notice::Branch and podspec version agree: $PODSPEC_VERSION"

      # Ship Package.swift only exposes the PulseKit library. CI temporarily adds a second target + product
      # so Xcode generates scheme PulseKitValidation and xcodebuild can compile/link Example/Sources against PulseKit (SPM smoke test).
      - name: Inject SPM validation target (CI-only edit)
        run: |
          python3 << 'PYEOF'
          from pathlib import Path

          path = Path("Package.swift")
          content = path.read_text()

          if 'name: "PulseKitValidation"' in content:
              path.write_text(content)
              print("PulseKitValidation already present; skipping injection")
          else:
              # Second product library
              content = content.replace(
                  '.library(name: "PulseKit", targets: ["PulseKitWrapper"]),',
                  '.library(name: "PulseKit", targets: ["PulseKitWrapper"]),\n        .library(name: "PulseKitValidation", targets: ["PulseKitValidation"]),',
                  1,
              )
              # Insert validation target immediately after PulseKitWrapper target
              m = re.search(
                  r'(path:\s*"Sources/PulseKitWrapper"\s*\),)(\s*\n\s*\])',
                  content,
              )
              if not m:
                  print("::error::Could not find PulseKitWrapper target closing in Package.swift")
                  raise SystemExit(1)
              injection = (
                  m.group(1)
                  + "\n"
                  + "        .target(\n"
                  + '            name: "PulseKitValidation",\n'
                  + "            dependencies: [\n"
                  + '                "PulseKitWrapper",\n'
                  + "            ],\n"
                  + '            path: "Example/Sources"\n'
                  + "        ),"
                  + m.group(2)
              )
              content = content[: m.start()] + injection + content[m.end() :]
              path.write_text(content)
              print("Injected PulseKitValidation target + product")

          print("--- Package.swift (tail) ---")
          print("\n".join(path.read_text().splitlines()[-35:]))
          PYEOF

          echo "::notice::Package.swift updated for SPM smoke build"

      - name: Build SPM validation target (iOS Simulator)
        run: |
          set -o pipefail
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild build \
              -scheme PulseKitValidation \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              CODE_SIGNING_ALLOWED=NO 2>&1 | xcpretty
          else
            xcodebuild build \
              -scheme PulseKitValidation \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              CODE_SIGNING_ALLOWED=NO
          fi
          echo "::notice::PulseKitValidation built for iOS Simulator"

      - name: Build SPM validation target (iOS Device)
        run: |
          set -o pipefail
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild build \
              -scheme PulseKitValidation \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO 2>&1 | xcpretty
          else
            xcodebuild build \
              -scheme PulseKitValidation \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
          fi
          echo "::notice::PulseKitValidation built for iOS Device"

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Validate podspec
        run: |
          pod lib lint PulseKit.podspec --allow-warnings
          echo "::notice::Podspec lint passed"

      - name: Summary
        if: always()
        run: |
          echo "## Release PR Validation — v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | What it validates |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch vs podspec | \`release/<version>\` matches \`spec.version\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SPM smoke build (Simulator) | Injected \`PulseKitValidation\` target links & compiles |" >> $GITHUB_STEP_SUMMARY
          echo "| SPM smoke build (Device) | Same for device slice |" >> $GITHUB_STEP_SUMMARY
          echo "| CocoaPods lint | Podspec valid for trunk |" >> $GITHUB_STEP_SUMMARY
